spring.application.name=expensetracker

# Uses environment variable on Render
# Falls back to local PostgreSQL for development
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/expensetracker}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Required for Neon SSL connection
spring.datasource.hikari.connection-init-sql=SELECT 1
spring.datasource.hikari.ssl=true
